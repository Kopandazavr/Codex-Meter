name: Run dual bars patch

on:
  push:
    branches:
      - feature/dual-bars-persistent-monitor
    paths:
      - '.github/workflows/run-dual-bars-patch.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Execute embedded patch
        shell: bash
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          text = Path('.github/workflows/apply-dual-bars-persistent-monitor.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<embedded-dual-bars-patch>', 'exec'))
          PYRUN
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Kopandazavr"
          git config user.email "101416382+Kopandazavr@users.noreply.github.com"
          git add android/app/src/main/java/dev/bennett/codexmeter/NowBarManager.java \
                  android/app/src/main/java/dev/bennett/codexmeter/NowBarActionReceiver.java \
                  android/app/src/main/res/layout/notification_usage_dual_bars.xml
          git commit -m "Show dual usage bars and keep manual live monitor persistent"
          git push
